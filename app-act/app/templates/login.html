<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACT — Login</title>
    <style>
        :root { --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #e2e8f0; --accent: #3b82f6; --red: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
               display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
                     padding: 2rem; width: 100%; max-width: 360px; }
        h1 { font-size: 1.3rem; margin-bottom: 1.5rem; text-align: center; }
        input { background: var(--bg); border: 1px solid var(--border); color: var(--text);
                padding: 0.65rem; border-radius: 6px; width: 100%; font-size: 0.9rem; margin-bottom: 1rem; }
        button { background: var(--accent); color: #fff; border: none; padding: 0.65rem; border-radius: 6px;
                 width: 100%; font-size: 0.9rem; cursor: pointer; font-weight: 600; }
        .error { color: var(--red); font-size: 0.85rem; margin-bottom: 0.75rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🎫 ACT System</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
            <input type="password" name="token" placeholder="Admin Token" autofocus>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
